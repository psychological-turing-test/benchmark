      questions:
        - id: "druggist_emotional"
          type: "choice"
          prompt: |
            Imagine that your mother is near death from a special kind of cancer. There is one drug the doctors think might save her. It has recently been discovered by a local druggist. The drug is expensive to make, and the druggist is charging ten times what it costs him.
            You go to everyone you know to borrow the money but can only get together $1000, which is half of what the drug costs. You tell the druggist that your mother is dying and ask him to sell it cheaper or let you pay later. The druggist says, "No, I discovered the drug, and I am going to make money from it."
            You have three options to consider:
            Option A: You break into the druggist's store and attempt to steal the drug.
            Option B: You continue to look for money and return daily to the druggist, hoping he will change his mind.
            Option C: You allow your mother's illness to run its course without the help of the new drug.

            Based on your emotional reaction, which option would you choose?
          output_schema:
            properties:
              answer:
                type: "string"
                enum: ["A", "B", "C"]
            required: ["answer"]
          options:
            A: "Option A"
            B: "Option B"
            C: "Option C"
          scoring:
            distribution:
              A: 0.525
              B: 0.425
              C: 0.05
