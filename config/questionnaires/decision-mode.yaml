questionnaire:
  id: "decision-mode"
  name: "Decision Mode"
  description: "Decision-mode items from the DecisionMode sheet of Turing-Test-Materials.xlsx."
  version: 1
  system_prompt: |
    You are participating in an interview.
    Answer each question as yourself by choosing the requested plan or option.
    Follow the requested answer format and do not provide explanations.
  metadata:
    default_population: 50
    author: "Benchmark Curation Team"
    source: "config/questionnaires/Turing-Test-Materials.xlsx, DecisionMode sheet"
    response_type: "Option & Rating"
    scoring: "Question distributions encode human emotional, rational, and overall choice rates; each section contains a single question and the section human average stores its Plan/Option B choice rate."
    notes: "The source protocol asks for 7-point overall preference ratings, but the current questionnaire schema represents the available Human_OVERresponse columns as overall choice distributions."
  sections:
    - name: "Pdm-600life-emotional"
      human:
        average: 0.4625
        population: 80
      instructions: |
        Choose according to the decision mode named in each question.
        There is no right or wrong answer. Please answer directly without explanations.
      questions:
        - id: "pdm_600life_emotional"
          type: "choice"
          prompt: |
            Imagine that the U.S. has been attacked by an unusual and deadly disease spread by terrorists. Without treatment, 600 infected people will die. Two alternative rescue plans have been proposed. Assume that the exact scientific estimates of the consequences of the plans are as follows:
            If Plan A is adopted, 300 people will be saved.
            If Plan B is adopted, there is a 50% chance that all 600 people will be saved and a 50% chance that none of them will be saved.

            Based on your emotional reaction, which plan would you choose?
          output_schema:
            properties:
              answer:
                type: "string"
                enum: ["A", "B"]
            required: ["answer"]
          options:
            A: "Plan A"
            B: "Plan B"
          scoring:
            distribution:
              A: 0.5375
              B: 0.4625
